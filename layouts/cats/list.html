{{ define "main" }}

{{ with .Site.GetPage "section" "cats" }}

<div class="container">

  <!-- Section content -->
  <div class="row">
    <div class="col-12">

      <div class="content-box p-3 shadow-sm rounded text-center">

        {{ with .Content }}
          <div class="text-left">
            {{ . }}
          </div>
        {{ end }}

      </div>

    </div>
  </div>


  <!-- Cats grid -->
  <div class="row cat-grid">

    {{ range .Pages }}

      <div class="col-12 col-sm-6 col-md-4 col-lg-3">

        <div class="cat-card text-center">

          {{ with index .Params.images 0 }}

            <a href="{{ $.RelPermalink }}">
              <img
                class="cat-img"
                src="{{ . | relURL }}"
                alt="{{ $.Title }}"
              >
            </a>

          {{ end }}

          <h5 class="cat-name">
            {{ .Title }}
          </h5>

          <p class="cat-meta">
            {{ with .Params.age }}{{ . }}{{ end }}
            {{ with .Params.gender }} · {{ . }}{{ end }}
          </p>

        </div>

      </div>

    {{ end }}

  </div>

</div>

{{ end }}

{{ end }}
