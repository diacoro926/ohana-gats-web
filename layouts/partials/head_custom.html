<style>

/* === Global background and text === */

html, body {
  background-color: #fdeef8 !important;
  color: #2b2b2b;
  padding-top: 100px;
  font-family: 'Franklin Gothic Medium', sans-serif !important;
  line-height: 1.6;
}

/* Section spacing */

.section-gap {
  margin-top: 4rem;
  margin-bottom: 4rem;
}

/* Headings and paragraphs */

p, h1, h2, h3, h4, h5, h6 {
  color: #2b2b2b !important;
  margin-bottom: 1rem;
}

/* === Markdown list fixes === */

.content-wrapper ul,
.content-wrapper ol {
  padding-left: 1.4rem;
  margin-bottom: 1rem;
  list-style-position: outside;
}

.content-wrapper li {
  margin-bottom: 0.35rem;
}

/* === Header & Footer === */

.navbar,
footer {
  background-color: #E6E6FA !important;
  color: #fbbe6a;
}

.navbar a,
footer a {
  color: #2a292f !important;
}

footer {
  padding: 20px 0;
  font-size: 0.9rem;
}

/* === Content area === */

.content-wrapper {
  padding: 20px;
}

.content-box {
  background-color: #ffffff;
  padding: 19px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  margin-bottom: 15px;
  border: 2px solid #b14c75;
}

/* === Buttons === */

.btn,
button,
input[type="submit"] {
  background-color: #91b9f4;
  border: none;
  color: #fff !important;
  font-weight: 600;
  padding: 0.5rem 1.25rem;
  border-radius: 6px;
  transition: background-color 0.3s ease;
}

.btn:hover,
button:hover,
input[type="submit"]:hover {
  background-color: #f1c4ea;
}

/* === Cat grid styles === */

 /* ============================================================
   CAT GRID
   ============================================================ */

/*
 * Small vertical gap between rows.
 */
.cat-grid > [class*="col-"] {
    margin-bottom: 20px;
}


/* ============================================================
   CAT CARDS
   ============================================================ */

.cat-card {
    display: block;

    padding: 0;
    margin: 0;

    overflow: hidden;

    background: #fff;
    border-radius: 12px;

    text-align: center;

    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);

    transition: all 0.25s ease;
}

.cat-card:hover {
    transform: translateY(-5px);

    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
}


/* ============================================================
   CAT IMAGE
   ============================================================ */

.cat-card .cat-img {
    display: block;

    width: 100%;
    aspect-ratio: 4 / 3;
    height: auto;

    margin: 0;
    padding: 0;

    object-fit: cover;
}


/* ============================================================
   CAT NAME
   ============================================================ */

.cat-card .cat-name {
    margin: 10px 10px 5px;

    font-size: 1.1rem;
    line-height: 1.3;
}


/* ============================================================
   CAT META
   ============================================================ */

.cat-card .cat-meta {
    margin: 0 10px 12px;

    font-size: 0.9rem;
    line-height: 1.4;

    color: #555;
}


/* ============================================================
   CAT LINK
   ============================================================ */

.cat-card a {
    text-decoration: none;
}

.cat-card a:hover {
    text-decoration: none;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 767px) {

    .cat-grid > [class*="col-"] {
        margin-bottom: 20px;
    }

}
/* === Cat detail page === */



.cat-detail-card {
  padding: 30px;
  position: relative;
}

.cat-detail-img {
  max-width: 300px;
  width: 100%;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.cat-detail-name,
.cat-detail-meta,
.cat-detail-summary,
.cat-detail-content {
  font-size: inherit;
}

/* === Cat markdown sections === */

.cat-detail-content h3 {
  margin-top: 2rem;
  margin-bottom: 0.6rem;
  font-weight: 700;
}

/* Navigation buttons */

.cat-detail-nav {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  margin-top: 1.5rem;
}

.cat-detail-nav .nav-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 45px;
  min-height: 45px;

  font-size: 1.2rem;
  font-weight: bold;

  border-radius: 50%;
  border: 2px solid #e98a65;

  background-color: #fff;
  color: #e98a65 !important;

  transition: all 0.3s ease;
}

.cat-detail-nav .nav-btn:hover {
  background-color: #e98a65;
  color: #fff !important;
}

.cat-detail-nav .back-btn {
  border-color: #87a8c4;
  color: #87a8c4 !important;
}

.cat-detail-nav .back-btn:hover {
  background-color: #87a8c4;
  color: #fff !important;
}


/* Overlay text */

.overlay-title {
  font-size: 1.25rem;
  font-weight: bold;
  margin-bottom: 0.25rem;
}

.overlay-subtitle {
  font-size: 1rem;
  margin-bottom: 0.5rem;
}

.overlay .btn {
  background-color: #ffffff;
  color: #e98a65 !important;
  font-size: 0.9rem;
  padding: 0.35rem 0.9rem;
  border-radius: 4px;
}

.overlay .btn:hover {
  background-color: #f9f9f9;
}

/* === Adopted watermark === */

.cat-card,
.cat-detail-card {
  position: relative;
}



.adopted-watermark {
  position: absolute;
  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%) rotate(-20deg);

  font-size: 2.2rem;
  font-weight: 900;

  color: rgba(177, 76, 117, 0.70);

  text-transform: uppercase;
  white-space: nowrap;

  pointer-events: none;
  z-index: 10;
}

.cat-detail-card .adopted-watermark,
.adopted-detail {
  font-size: 4rem;
  color: rgba(177, 76, 117, 0.70);
}

/* === Contact form === */

.contact-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;

  max-width: 500px;
  margin: 0 auto;
}

.contact-form label {
  font-weight: 600;
  color: #2b2b2b;
  text-align: left;
}

.contact-form input,
.contact-form textarea {
  width: 100%;
  padding: 10px;

  border-radius: 6px;
  border: 1px solid #ccc;

  font-family: inherit;
  font-size: 1rem;
}

.contact-form input:focus,
.contact-form textarea:focus {
  outline: none;
  border-color: #e98a65;
  box-shadow: 0 0 0 2px rgba(233,138,101,0.2);
}

.contact-form button {
  align-self: flex-start;
}

/* Links */

.my-link {
  color: #2b2b2b;
  text-decoration: none;
}

.my-link:hover {
  color: #000000;
}

/* === Market products grid === */

.products-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  align-items: start;
}

@media (min-width: 700px) {
  .products-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.product-item {
  display: flex;
  align-items: center;
  gap: 16px;
}

.product-item img {
  width: 200px;
  flex-shrink: 0;
}

/* === Responsive adjustments === */

@media (max-width: 991px) {

  body {
    padding-top: 80px;
  }

}

@media (max-width: 575px) {

  body {
    padding-top: 70px;
  }

  h1 {
    font-size: 1.75rem;
  }

  h3 {
    font-size: 1.2rem;
  }

  p {
    font-size: 0.95rem;
  }

  /* Mobile markdown list fix */

  .content-wrapper ul,
  .content-wrapper ol {
    padding-left: 1.1rem;
  }

  .content-wrapper li {
    line-height: 1.45;
  }

  /* Mobile cat section blocks */

  .cat-detail-content h3 {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 8px;
    border-left: 4px solid #e98a65;
    font-size: 1.1rem;
  }

  .cat-detail-content ul,
  .cat-detail-content p {
    margin-left: 6px;
  }

  .adopted-watermark {
    font-size: 1.8rem;
  }

  .cat-detail-card .adopted-watermark,
  .adopted-detail {
    font-size: 2.6rem;
  }

}

@media (max-width: 500px) {

  .product-item {
    flex-direction: column;
    align-items: flex-start;
  }

  .product-item img {
    width: 100%;
    max-width: 220px;
  }

}

/*Cats images carousel*/
.cat-thumb {
  border: 2px solid transparent;
  border-radius: 5px;
  transition: border 0.2s;
}
.cat-thumb:hover {
  border-color: #007bff;
}
.thumb-active {
  border-color: #007bff;
}

.privacy-page {
  background: transparent;
  box-shadow: none;
}

.privacy-content {
  background: #fff;
  color: #2b2b2b;
  padding: 2rem;
  border-radius: 8px;
  border: 2px solid #b14c75;
}
.footer-legal {
  margin-top: 15px;
  font-size: 0.9rem;
}

.footer-legal a {
  color: #2a292f;
  text-decoration: underline;
}

.footer-legal a:hover {
  opacity: 0.7;
}

.privacy-note p {
  margin: 0;
}
.privacy-content p,
.privacy-content li {
  font-size: 1rem;
  line-height: 1.7;
}

@media (max-width: 575px) {

  .privacy-content p,
  .privacy-content li {
    font-size: 1rem;
    line-height: 1.75;
  }

}

/* =========================
   COOKIE BANNER
   ========================= */

.cookie-banner {
  position: fixed;
  inset: 0;
  z-index: 99999;

  background: rgba(0, 0, 0, 0.6);

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
}
.cookie-hidden {
  display: none !important;
}

 

.cookie-banner__inner {
  background: #ffffff;

  width: 100%;
  max-width: 560px;

  padding: 28px;

  border-radius: 14px;
  border: 2px solid #b14c75;

  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);

  display: flex;
  flex-direction: column;
  gap: 20px;
}

 

.cookie-banner__text {
  margin: 0;

  font-size: 1.15rem;   /* bigger text */
  line-height: 1.6;

  color: #2b2b2b;
}

/* =========================
   BUTTONS  
   ========================= */

.cookie-banner__actions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
}

 
.cookie-banner__actions button {
  font-weight: 600;

  padding: 0.65rem 1.4rem;

  border-radius: 8px;
  border: none;

  cursor: pointer;

  font-size: 1rem;

  transition: 0.2s ease;

  background-color: #91b9f4;
  color: #fff;
}

/* Hover for both */
.cookie-banner__actions button:hover {
  background-color: #7ea6e6;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {
  .cookie-banner__inner {
    padding: 22px;
  }

  .cookie-banner__text {
    font-size: 1.05rem;
  }

  .cookie-banner__actions {
    flex-direction: column;
    width: 100%;
  }

  .cookie-banner__actions button {
    width: 100%;
  }
}


/*  logo */

.avatar-container,
.avatar-img-border {
    width: 130px !important;
    height: 130px !important;
}

.avatar-img {
    width: 100%;
    height: 100%;
}

/*Help us*/

.help-card h4 {
    margin: 12px 0 0;
    font-size: 1.1rem;
}

.help-card img {
    width: 100%;

    object-fit: contain;
}

/* Smooth scrolling */
html {
    scroll-behavior: smooth;
}

.help-nav {
    margin: 40px 0;
}

 .help-card {
    display: block;

/*Index video*/
.homepage-video{
    margin:40px 0;
}

.homepage-video video{
    width:100%;
    max-width:900px;
    display:block;
    margin:auto;
}


/* ============================================================
   OHANA AUTOMATIC CAROUSEL
   ============================================================ */

.about-carousel {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto 25px;
  overflow: hidden;
  border-radius: 10px;

  /* All images have the same visual dimensions */
  aspect-ratio: 16 / 9;
}


/*
 * All slides occupy the same position.
 */
.about-carousel__slide {
  position: absolute !important;
  top: 0;
  left: 0;

  width: 100% !important;

  opacity: 0;
  visibility: hidden;

  transition: opacity 700ms ease;
}


/*
 * The first slide establishes the carousel height.
 */
.about-carousel__slide:first-child {
  position: relative !important;
}


/*
 * Only the active slide is visible.
 */
.about-carousel__slide.is-active {
  opacity: 1;
  visibility: visible;
  z-index: 1;
}


/*
 * Responsive images.
 */
.about-carousel__slide img {
  display: block !important;

  width: 100% !important;
  height: auto !important;

  margin: 0 !important;
  padding: 0 !important;

  border-radius: 0;
}


/*
 * Don't animate for users who prefer reduced motion.
 */
@media (prefers-reduced-motion: reduce) {

  .about-carousel__slide {
    transition: none;
  }

}
