<style>

}

}

   ABOUT CAROUSEL
   ============================================================ */

.about-carousel {
  position: relative;
  width: 100%;
  max-width: 700px;
  margin: 0 auto 25px;
  overflow: hidden;
  border-radius: 10px;
  aspect-ratio: 16 / 9;
}

.about-carousel__slide {
  position: absolute !important;
  top: 0;
  left: 0;
  width: 100% !important;
  opacity: 0;
  visibility: hidden;
  transition: opacity 700ms ease;
}

.about-carousel__slide:first-child {

}

.about-carousel__slide.is-active {
  opacity: 1;
  visibility: visible;
  z-index: 1;
}

.about-carousel__slide img {
  display: block !important;
  width: 100% !important;
  height: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border-radius: 0;
}

   NEWS IMAGE GALLERY
   ========================================= */

.news-slideshow {

}

.slideshow-container {

  border-radius: 12px;
  line-height: 0;
}
.slide {
  display: none;
  width: 100%;
}

.slide.active {

}

.news-slideshow-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: contain;
  object-position: center;
  border-radius: 0;
}

.slideshow-prev,
.slideshow-next {

  top: 50%;
  transform: translateY(-50%);

  height: 45px;

  border-radius: 50%;

  background: rgba(0, 0, 0, 0.55);
  color: white;

  font-size: 24px;
  line-height: 45px;
  text-align: center;

  cursor: pointer;
  z-index: 10;

  transition: background 0.2s ease;
}

.slideshow-prev {
  left: 15px;
}

.slideshow-next {
  right: 15px;
}

.slideshow-prev:hover,
.slideshow-next:hover {

.slideshow-dots {

.slideshow-dot {

}

.slideshow-dot.active {

}
